[package]
name = "sessions"
version = "1.0.0"
edition = "2021"
description = "Shopping Sessions: exact, parallel click-stream sessionization to Parquet"
publish = false

[[bin]]
name = "sessions"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
